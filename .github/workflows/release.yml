name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Uncomment-Windows-x64
          - os: ubuntu-latest
            artifact_name: Uncomment-Linux-x64
          - os: macos-latest
            artifact_name: Uncomment-macOS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone app (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --windowed --onefile --name Uncomment --paths src src/main.py
          Compress-Archive -Path dist/Uncomment.exe -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Build standalone app (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --windowed --onefile --name Uncomment --paths src src/main.py
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist Uncomment

      - name: Build standalone app (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name Uncomment --paths src src/main.py
          ditto -c -k --sequesterRsrc --keepParent dist/Uncomment.app ${{ matrix.artifact_name }}.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*